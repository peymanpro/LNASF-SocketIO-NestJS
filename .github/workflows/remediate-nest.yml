name: One-time NestJS security remediation

on:
  push:
    branches:
      - 'remediate/nestjs-12-security-20261010'

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out remediation branch
        uses: actions/checkout@v7
        with:
          ref: remediate/nestjs-12-security-20261010
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install aligned NestJS v12 toolchain
        run: npm install --save-exact @nestjs/common@12.1.2 @nestjs/core@12.1.2 @nestjs/platform-express@12.1.2 @nestjs/platform-socket.io@12.1.2 @nestjs/websockets@12.1.2 @nestjs/cli@12.0.8 @nestjs/schematics@12.0.6 reflect-metadata@0.2.2 typescript@^6 @types/node@22.19.0 socket.io@latest --no-fund

      - name: Apply non-breaking audit remediations
        run: npm audit fix --no-fund || echo "Some advisories remain; no force upgrade will be applied."

      - name: Verify clean lockfile installation
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Tests
        run: npm test

      - name: Record remaining audit findings
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node -e 'const fs=require("node:fs"); const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/npm-audit.json","utf8")); console.log("NPM_AUDIT_SUMMARY="+JSON.stringify(r.metadata?.vulnerabilities ?? {}));'

      - name: Commit verified lockfile and remove temporary workflow
        env:
          BRANCH_NAME: remediate/nestjs-12-security-20261010
        run: |
          rm .github/workflows/remediate-nest.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "security: upgrade NestJS dependencies to v12"
          git push origin "HEAD:refs/heads/$BRANCH_NAME"
